services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  fastapi_app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Train and evaluate the model
        working-directory: src
        run: python train.py --output "$RUNNER_TEMP/temperature_model.joblib"
      - name: Validate Compose file
        run: docker compose -f docker/docker-compose.yaml config --quiet
      - name: Build application image
        run: docker build -f docker/Dockerfile -t iot-telemetry-gateway:ci .
